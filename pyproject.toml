[project]
name = "python-bosch-ebike-connect"
version = "0.1.0"
description = "A Python client for the Bosch eBike Connect API"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.11"
dependencies = [
    "folium>=0.20.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
